server:
  port: ${SERVER_PORT:8100}

platform:
  instance:
    offline-threshold-seconds: ${OFFLINE_THRESHOLD_SECONDS:70}      # 实例离线判定阈值（秒）
  sentinel:
    # 哨兵随指标每 5 分钟上报一次，阈值需大于采集周期（默认 330s = 5.5min）
    offline-threshold-seconds: ${SENTINEL_OFFLINE_THRESHOLD_SECONDS:330}
  alarm:
    notice:
      enabled: false                    # 告警邮件通知开关
      receivers:                        # 接收人列表
        - ops@example.com
    auto-recover:
      periods: 2                        #连续回落周期数，达到后自动恢复；<=0 关闭自动恢复

  register-code: ${REGISTER_CODE:Danuvius}
  retain-days: ${RETAIN_DAYS:7}
  report:
    export-dir: ${REPORT_EXPORT_DIR:./exports}
    download-prefix: /report/download


spring: #临时
  mail:                                 # 启用邮件通知时配置
    host: smtp.example.com
    username: notice@example.com
    password: xxxx




  application:
    name: redis-monitor-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:5432/postgres}
    username: ${DB_USERNAME:postgres.dbtakxbjecdydxfeytov}
    password: ${DB_PASSWORD:Danuvius5732}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl




logging:
  level:
    com.danuvius.platform: INFO
